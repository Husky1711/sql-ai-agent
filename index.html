<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL AI Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        /* Sticky Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(51, 65, 85, 0.3);
            z-index: 1000;
            padding: 0 20px;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-brand i {
            color: #3b82f6;
        }

        .nav-menu {
            display: flex;
            gap: 8px;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-link:hover {
            color: #e2e8f0;
            background: rgba(51, 65, 85, 0.3);
        }

        .nav-link.active {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: #3b82f6;
            border-radius: 1px;
        }

        .status-indicators {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-online {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-offline {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Main Content */
        .main-content {
            margin-top: 70px;
            min-height: calc(100vh - 70px);
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Loading Animation */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: #94a3b8;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #334155;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 16px;
                height: 60px;
            }

            .nav-brand {
                font-size: 1.2rem;
            }

            .nav-menu {
                gap: 4px;
            }

            .nav-link {
                padding: 8px 12px;
                font-size: 14px;
            }

            .status-indicators {
                gap: 8px;
            }

            .status-badge {
                padding: 4px 8px;
                font-size: 11px;
            }

            .main-content {
                margin-top: 60px;
            }

            .content-container {
                padding: 16px;
            }
        }

        @media (max-width: 480px) {
            .nav-menu {
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(15, 23, 42, 0.95);
                backdrop-filter: blur(10px);
                border-top: 1px solid rgba(51, 65, 85, 0.3);
                padding: 16px;
                display: none;
            }

            .nav-menu.active {
                display: flex;
            }

            .nav-link {
                justify-content: center;
                width: 100%;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        /* Page-specific styles for dynamically loaded content */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .page-subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .card-description {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-1px);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .status-connected {
            color: #10b981;
        }

        .status-disconnected {
            color: #ef4444;
        }

        /* Chat Interface Styles */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-height: 600px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            margin-bottom: 20px;
            max-height: 500px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease-in;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #3b82f6;
            color: white;
        }

        .message.assistant .message-avatar {
            background: #059669;
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #3b82f6;
            color: white;
        }

        .message.assistant .message-content {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
        }

        .chat-input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 12px;
            color: #f8fafc;
            font-size: 14px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            transition: all 0.2s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .send-button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-button:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-1px);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            color: #e2e8f0;
        }

        .status-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .sql-preview {
            background: #0f172a;
            color: #e2e8f0;
            padding: 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 12px;
            margin-top: 8px;
            border: 1px solid #334155;
        }

        .sql-result {
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            margin-top: 12px;
            overflow-x: auto;
            border: 1px solid #334155;
        }

        details {
            margin-top: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            background: #1e293b;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
            color: #e2e8f0;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        summary:hover {
            background: #334155;
        }

        details[open] summary {
            margin-bottom: 12px;
        }

        .welcome-message {
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
        }

        .welcome-message h3 {
            color: #e2e8f0;
            margin-bottom: 10px;
        }

        .schema-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .schema-table th,
        .schema-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        .schema-table th {
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            font-weight: 600;
        }

        .schema-table td {
            color: #94a3b8;
        }

        /* Enhanced Response Styling */
        .nlp-response {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .nlp-response p {
            margin: 0 0 12px 0;
            line-height: 1.6;
        }

        .nlp-response p:last-child {
            margin-bottom: 0;
        }

        .response-list {
            margin: 12px 0;
            padding-left: 20px;
        }

        .response-list li {
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .results-summary {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .results-summary h4 {
            color: #10b981;
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-count {
            margin: 0;
            color: #e2e8f0;
        }

        .results-table {
            margin-bottom: 16px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .data-table th {
            background: rgba(51, 65, 85, 0.8);
            color: #e2e8f0;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table td {
            padding: 12px;
            color: #f8fafc;
            border-bottom: 1px solid #334155;
        }

        .data-table tr:hover {
            background: rgba(51, 65, 85, 0.3);
        }

        .more-results {
            text-align: center;
            color: #94a3b8;
            font-style: italic;
            margin: 12px 0 0 0;
            padding: 8px;
            background: rgba(51, 65, 85, 0.3);
            border-radius: 4px;
        }

        .technical-details {
            margin-top: 16px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
        }

        .technical-details summary {
            padding: 12px 16px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 8px 8px 0 0;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .technical-details summary:hover {
            background: rgba(51, 65, 85, 0.7);
        }

        .tech-content {
            padding: 16px;
        }

        .sql-section, .performance-section {
            margin-bottom: 16px;
        }

        .sql-section:last-child, .performance-section:last-child {
            margin-bottom: 0;
        }

        .sql-section h5, .performance-section h5 {
            color: #e2e8f0;
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .performance-metrics {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .metric i {
            color: #3b82f6;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            
            .page-title {
                font-size: 2rem;
            }
            
            .message-content {
                max-width: 85%;
            }

            .data-table {
                font-size: 0.8rem;
            }

            .data-table th,
            .data-table td {
                padding: 8px;
            }

            .performance-metrics {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Sticky Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-robot"></i>
                SQL AI Agent
            </div>
            
            <div class="nav-menu" id="navMenu">
                <div class="nav-item">
                    <a href="#" class="nav-link" onclick="loadPage('auth')">
                        <i class="fas fa-shield-alt"></i>
                        <span>Authentication</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="#" class="nav-link" onclick="loadPage('config')">
                        <i class="fas fa-cog"></i>
                        <span>Configuration</span>
                    </a>
                </div>
                <div class="nav-item">
                    <a href="#" class="nav-link active" onclick="loadPage('chat')">
                        <i class="fas fa-comments"></i>
                        <span>Chat Interface</span>
                    </a>
                </div>
            </div>
            
            <div class="status-indicators">
                <div class="status-badge status-offline" id="apiStatus">
                    <i class="fas fa-circle"></i>
                    <span>API Offline</span>
                </div>
                <div class="status-badge status-offline" id="wsStatus">
                    <i class="fas fa-circle"></i>
                    <span>WS Disconnected</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-container">
            <div id="contentArea">
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading Chat Interface...</div>
                    <div class="loading-subtext">Please wait while we prepare your workspace</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentPage = 'chat';
        let ws = null;

        // Load page content dynamically
        async function loadPage(pageName) {
            if (currentPage === pageName) return;
            
            currentPage = pageName;
            
            // Update navigation
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            document.querySelector(`[onclick="loadPage('${pageName}')"]`).classList.add('active');
            
            // Show loading
            const contentArea = document.getElementById('contentArea');
            contentArea.innerHTML = `
                <div class="loading-container">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading ${getPageTitle(pageName)}...</div>
                    <div class="loading-subtext">Please wait while we prepare your workspace</div>
                </div>
            `;
            
            try {
                // Load the page content from the server
                const response = await fetch(`http://localhost:8000/${pageName}.html`);
                if (response.ok) {
                    const html = await response.text();
                    
                    // Extract body content
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const bodyContent = doc.body.innerHTML;
                    
                    // Update content area
                    contentArea.innerHTML = bodyContent;
                    contentArea.classList.add('fade-in');
                    
                    // Execute any scripts from the loaded page, but avoid conflicts
                    const scripts = doc.querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        // Clean up variable declarations to avoid conflicts
                        let scriptContent = script.textContent;
                        
                        // Replace variable declarations to avoid conflicts
                        scriptContent = scriptContent.replace(/let authToken/g, 'window.authToken = window.authToken || null');
                        scriptContent = scriptContent.replace(/let ws/g, 'window.ws = window.ws || null');
                        scriptContent = scriptContent.replace(/let isConnected/g, 'window.isConnected = window.isConnected || false');
                        
                        newScript.textContent = scriptContent;
                        document.head.appendChild(newScript);
                    });
                    
                    // Initialize page-specific functionality
                    initializePage(pageName);
                    
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                console.error('Failed to load page:', error);
                contentArea.innerHTML = `
                    <div class="loading-container">
                        <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ef4444; margin-bottom: 20px;"></i>
                        <div class="loading-text">Failed to load ${getPageTitle(pageName)}</div>
                        <div class="loading-subtext">Error: ${error.message}</div>
                        <button onclick="loadPage('${pageName}')" style="margin-top: 20px; padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer;">
                            <i class="fas fa-refresh"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        function getPageTitle(pageName) {
            const titles = {
                'auth': 'Authentication',
                'config': 'Configuration',
                'chat': 'Chat Interface'
            };
            return titles[pageName] || 'Page';
        }

        function initializePage(pageName) {
            // Page-specific initialization
            switch(pageName) {
                case 'auth':
                    // Initialize auth page
                    updateAuthStatus();
                    break;
                case 'config':
                    // Initialize config page
                    updateConnectionStatus();
                    loadSchema();
                    break;
                case 'chat':
                    // Initialize chat page
                    connectChatWebSocket();
                    break;
            }
        }

        // WebSocket connection for status monitoring
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//localhost:8000/ws/query`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function(event) {
                updateStatus('wsStatus', 'online', 'WS Connected');
                console.log('WebSocket connected successfully');
            };
            
            ws.onmessage = function(event) {
                console.log('WebSocket message received:', event.data);
                // Handle status messages
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'status') {
                        console.log('Status update:', data.message);
                    }
                } catch (e) {
                    console.log('Non-JSON message:', event.data);
                }
            };
            
            ws.onclose = function(event) {
                updateStatus('wsStatus', 'offline', 'WS Disconnected');
                console.log('WebSocket disconnected:', event.code, event.reason);
                // Try to reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = function(error) {
                updateStatus('wsStatus', 'offline', 'WS Error');
                console.error('WebSocket error:', error);
            };
        }

        function updateStatus(elementId, status, text) {
            const element = document.getElementById(elementId);
            if (element) {
                element.className = `status-badge status-${status}`;
                element.querySelector('span').textContent = text;
            }
        }

        // API status check
        async function checkApiStatus() {
            try {
                const response = await fetch('http://localhost:8000/api/health');
                if (response.ok) {
                    updateStatus('apiStatus', 'online', 'API Online');
                } else {
                    updateStatus('apiStatus', 'offline', 'API Offline');
                }
            } catch (error) {
                updateStatus('apiStatus', 'offline', 'API Offline');
            }
        }

        // Global authentication functions
        window.authToken = null;

        // Authentication functions
        async function authenticate() {
            const username = document.getElementById('authUsername')?.value || 'admin';
            const password = document.getElementById('authPassword')?.value || 'admin123';
            const messageDiv = document.getElementById('authMessage');

            if (!username || !password) {
                showMessage('Please enter both username and password', 'error');
                return;
            }

            try {
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    window.authToken = data.access_token;
                    localStorage.setItem('authToken', window.authToken);
                    showMessage('Login successful!', 'success');
                    updateAuthStatus();
                } else {
                    showMessage(data.detail || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Connection error: ' + error.message, 'error');
            }
        }

        async function logout() {
            window.authToken = null;
            localStorage.removeItem('authToken');
            showMessage('Logged out successfully', 'success');
            updateAuthStatus();
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('authMessage');
            if (messageDiv) {
                messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            }
        }

        async function updateAuthStatus() {
            if (!window.authToken) {
                const authStatusValue = document.getElementById('authStatusValue');
                const userRole = document.getElementById('userRole');
                const lastLogin = document.getElementById('lastLogin');
                
                if (authStatusValue) authStatusValue.textContent = 'Not Authenticated';
                if (userRole) userRole.textContent = '-';
                if (lastLogin) lastLogin.textContent = '-';
                return;
            }

            try {
                const response = await fetch('http://localhost:8000/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${window.authToken}`
                    }
                });

                if (response.ok) {
                    const userData = await response.json();
                    const authStatusValue = document.getElementById('authStatusValue');
                    const userRole = document.getElementById('userRole');
                    const lastLogin = document.getElementById('lastLogin');
                    
                    if (authStatusValue) authStatusValue.textContent = 'Authenticated';
                    if (userRole) userRole.textContent = userData.role || 'User';
                    if (lastLogin) lastLogin.textContent = new Date().toLocaleString();
                } else {
                    const authStatusValue = document.getElementById('authStatusValue');
                    if (authStatusValue) authStatusValue.textContent = 'Session Expired';
                }
            } catch (error) {
                const authStatusValue = document.getElementById('authStatusValue');
                if (authStatusValue) authStatusValue.textContent = 'Error';
            }
        }

        // Database connection functions
        async function connectDatabase() {
            const host = document.getElementById('dbHost')?.value || 'localhost';
            const port = document.getElementById('dbPort')?.value || '3306';
            const username = document.getElementById('dbUsername')?.value || 'root';
            const password = document.getElementById('dbPassword')?.value || 'Sandhya@332';
            const dbName = document.getElementById('dbName')?.value || 'ecommerce_test';
            const messageDiv = document.getElementById('dbMessage');

            if (!host || !username || !password || !dbName) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            if (!window.authToken) {
                showMessage('Please authenticate first', 'error');
                return;
            }

            try {
                const connectionString = `mysql+pymysql://${username}:${encodeURIComponent(password)}@${host}:${port}/${dbName}`;
                
                const response = await fetch('http://localhost:8000/api/databases/connect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${window.authToken}`
                    },
                    body: JSON.stringify({
                        connection_string: connectionString,
                        name: dbName
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.isConnected = true;
                    showMessage(`Connected to database: ${dbName}`, 'success');
                    updateConnectionStatus(dbName);
                    loadSchema();
                } else {
                    showMessage(data.detail || 'Connection failed', 'error');
                }
            } catch (error) {
                showMessage('Connection error: ' + error.message, 'error');
            }
        }

        function updateConnectionStatus(dbName) {
            const connectionStatus = document.getElementById('connectionStatus');
            const currentDatabase = document.getElementById('currentDatabase');
            
            if (connectionStatus) {
                connectionStatus.textContent = 'Connected';
                connectionStatus.className = 'status-connected';
            }
            if (currentDatabase) {
                currentDatabase.textContent = dbName;
            }
        }

        async function loadSchema() {
            if (!window.authToken) return;

            try {
                const response = await fetch('http://localhost:8000/api/databases/schema', {
                    headers: {
                        'Authorization': `Bearer ${window.authToken}`
                    }
                });

                if (response.ok) {
                    const schema = await response.json();
                    displaySchema(schema);
                    const tableCount = document.getElementById('tableCount');
                    if (tableCount) tableCount.textContent = schema.total_tables || 0;
                }
            } catch (error) {
                console.error('Failed to load schema:', error);
            }
        }

        function displaySchema(schema) {
            const content = document.getElementById('schemaContent');
            
            if (!content) return;
            
            if (!schema.tables || schema.tables.length === 0) {
                content.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 40px;">No tables found</p>';
                return;
            }

            let html = `
                <table class="schema-table">
                    <thead>
                        <tr>
                            <th>Table Name</th>
                            <th>Columns</th>
                            <th>Rows</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            schema.tables.forEach(table => {
                html += `
                    <tr>
                        <td>${table.table_name}</td>
                        <td>${table.columns ? table.columns.length : 0}</td>
                        <td>${table.row_count || 'N/A'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            content.innerHTML = html;
        }

        // Chat Interface Functions
        window.ws = null;
        window.isConnected = false;

        // WebSocket connection for chat
        function connectChatWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//localhost:8000/ws/query`;
            
            window.ws = new WebSocket(wsUrl);
            
            window.ws.onopen = function(event) {
                window.isConnected = true;
                console.log('Chat WebSocket connected');
            };
            
            window.ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };
            
            window.ws.onclose = function(event) {
                window.isConnected = false;
                console.log('Chat WebSocket disconnected');
                // Try to reconnect after 3 seconds
                setTimeout(connectChatWebSocket, 3000);
            };
            
            window.ws.onerror = function(error) {
                console.error('Chat WebSocket error:', error);
            };
        }

        function handleWebSocketMessage(data) {
            switch(data.type) {
                case 'status':
                    updateStatusMessage(data.message, data.step);
                    break;
                case 'sql_generated':
                    showGeneratedSQL(data.sql_query);
                    break;
                case 'query_executed':
                    showQueryResults(data.result, data.execution_time);
                    break;
                case 'complete':
                    showFinalResponse(data);
                    break;
                case 'error':
                    showError(data.error);
                    break;
            }
        }

        function updateStatusMessage(message, step) {
            // Remove any existing status messages
            const existingStatus = document.querySelector('.status-message');
            if (existingStatus) {
                existingStatus.remove();
            }
            
            // Add new status message
            const statusDiv = document.createElement('div');
            statusDiv.className = 'status-message';
            statusDiv.innerHTML = `
                <div class="status-content">
                    <div class="status-spinner"></div>
                    <span>${message}</span>
                </div>
            `;
            
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) {
                chatMessages.appendChild(statusDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        function showGeneratedSQL(sqlQuery) {
            const statusDiv = document.querySelector('.status-message');
            if (statusDiv) {
                statusDiv.innerHTML = `
                    <div class="status-content">
                        <i class="fas fa-check-circle" style="color: #10b981;"></i>
                        <span>SQL Generated Successfully</span>
                    </div>
                    <div class="sql-preview">${sqlQuery}</div>
                `;
            }
        }

        function showQueryResults(result, executionTime) {
            const statusDiv = document.querySelector('.status-message');
            if (statusDiv) {
                const resultCount = result ? result.length : 0;
                statusDiv.innerHTML = `
                    <div class="status-content">
                        <i class="fas fa-check-circle" style="color: #10b981;"></i>
                        <span>Query Executed - ${resultCount} rows returned (${(executionTime * 1000).toFixed(2)}ms)</span>
                    </div>
                `;
            }
        }

        function showFinalResponse(data) {
            console.log('Final response data:', data);
            console.log('Result data:', data.result);
            console.log('Result length:', data.result ? data.result.length : 'undefined');
            
            // Remove status message
            const statusDiv = document.querySelector('.status-message');
            if (statusDiv) {
                statusDiv.remove();
            }
            
            let responseText = '';
            
            // Show natural language response prominently with better formatting
            if (data.nlp_response) {
                // Parse and format the NLP response better
                let formattedResponse = data.nlp_response;
                
                // Convert numbered lists to proper HTML lists
                formattedResponse = formattedResponse.replace(/(\d+\.\s+[^\n]+(?:\n\d+\.\s+[^\n]+)*)/g, (match) => {
                    const items = match.split(/\n/).map(item => item.replace(/^\d+\.\s+/, ''));
                    return `<ul class="response-list">${items.map(item => `<li>${item}</li>`).join('')}</ul>`;
                });
                
                // Convert line breaks to proper HTML
                formattedResponse = formattedResponse.replace(/\n\n/g, '</p><p>');
                formattedResponse = formattedResponse.replace(/\n/g, '<br>');
                
                // Wrap in paragraphs
                if (!formattedResponse.startsWith('<')) {
                    formattedResponse = `<p>${formattedResponse}</p>`;
                }
                
                responseText += `<div class="nlp-response">${formattedResponse}</div><br>`;
            }
            
            // Show results in a structured way if available
            if (data.result && data.result.length > 0) {
                console.log('Creating results table for', data.result.length, 'records');
                responseText += `<div class="results-summary">
                    <h4><i class="fas fa-table"></i> Query Results</h4>
                    <p class="result-count">Found <strong>${data.result.length}</strong> records</p>
                </div>`;
                
                // Show ALL results in a nice table format (not just first 5)
                const displayResults = data.result; // Show all results
                console.log('Display results:', displayResults);
                responseText += `<div class="results-table">
                    <table class="data-table">
                        <thead>
                            <tr>`;
                
                // Get column headers from first result
                const columns = Object.keys(displayResults[0]);
                console.log('Columns:', columns);
                columns.forEach(col => {
                    responseText += `<th>${col.replace(/_/g, ' ').toUpperCase()}</th>`;
                });
                
                responseText += `</tr>
                        </thead>
                        <tbody>`;
                
                // Add data rows for ALL results
                displayResults.forEach((row, index) => {
                    console.log(`Row ${index}:`, row);
                    responseText += `<tr>`;
                    columns.forEach(col => {
                        responseText += `<td>${row[col] || '-'}</td>`;
                    });
                    responseText += `</tr>`;
                });
                
                responseText += `</tbody>
                    </table>
                </div>`;
            } else {
                console.log('No results to display or empty results array');
            }
            
            // Show technical details in collapsible sections
            responseText += `<details class="technical-details">
                <summary><i class="fas fa-code"></i> Technical Details</summary>
                <div class="tech-content">
                    <div class="sql-section">
                        <h5><i class="fas fa-database"></i> Generated SQL</h5>
                        <div class="sql-result">${data.sql_query}</div>
                    </div>
                    
                    <div class="performance-section">
                        <h5><i class="fas fa-stopwatch"></i> Performance</h5>
                        <div class="performance-metrics">
                            <span class="metric"><i class="fas fa-clock"></i> Execution Time: ${(data.execution_time * 1000).toFixed(2)}ms</span>
                            <span class="metric"><i class="fas fa-list"></i> Rows Returned: ${data.result ? data.result.length : 0}</span>
                        </div>
                    </div>
                </div>
            </details>`;

            addMessage('assistant', responseText);
        }

        function showError(error) {
            // Remove status message
            const statusDiv = document.querySelector('.status-message');
            if (statusDiv) {
                statusDiv.remove();
            }
            
            addMessage('assistant', `Error: ${error}`);
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;

            if (!window.authToken) {
                addMessage('assistant', 'Please authenticate first before sending queries.');
                return;
            }

            if (!window.isConnected) {
                addMessage('assistant', 'Please connect to a database first.');
                return;
            }

            // Add user message
            addMessage('user', message);
            input.value = '';
            input.style.height = 'auto';

            // Send query via WebSocket with auth token
            if (window.ws && window.ws.readyState === WebSocket.OPEN) {
                window.ws.send(JSON.stringify({ 
                    query: message,
                    token: window.authToken
                }));
            } else {
                addMessage('assistant', 'WebSocket connection not available. Please refresh the page.');
            }
        }

        function addMessage(type, content) {
            const messagesContainer = document.getElementById('chatMessages');
            
            if (!messagesContainer) return;
            
            // Remove welcome message if it exists
            const welcomeMessage = messagesContainer.querySelector('.welcome-message');
            if (welcomeMessage) {
                welcomeMessage.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = type === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Initialize on page load
        window.onload = function() {
            // Load default page (chat)
            loadPage('chat');
            
            // Initialize auth token from localStorage
            window.authToken = localStorage.getItem('authToken');
            
            // Start status monitoring
            checkApiStatus();
            connectWebSocket();
            
            // Check API status every 30 seconds
            setInterval(checkApiStatus, 30000);
        };

        // Handle browser back/forward buttons
        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.page) {
                loadPage(event.state.page);
            }
        });

        // Update URL when page changes
        function updateURL(pageName) {
            const url = new URL(window.location);
            url.searchParams.set('page', pageName);
            window.history.pushState({ page: pageName }, '', url);
        }

        // Override loadPage to update URL
        const originalLoadPage = loadPage;
        loadPage = function(pageName) {
            originalLoadPage(pageName);
            updateURL(pageName);
        };

        // Check for page parameter in URL on load
        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get('page');
            if (page && ['auth', 'config', 'chat'].includes(page)) {
                loadPage(page);
            }
        });
    </script>
</body>
</html>
