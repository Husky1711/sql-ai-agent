name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8
      
      - name: Lint with flake8
        run: |
          flake8 app/ --max-line-length=120 --ignore=E501,W503 || true
      
      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short || true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to Production Server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY_SCRIPT'
            set -e
            echo "📦 Deploying SQL AI Agent..."
            cd $DEPLOY_PATH
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            echo "🔄 Restarting service..."
            sudo systemctl restart sql-ai-agent
            echo "✅ Deployment complete!"
          DEPLOY_SCRIPT
      
      - name: Notify Success
        if: success()
        run: echo "✅ Deployment to production successful!"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed!"
